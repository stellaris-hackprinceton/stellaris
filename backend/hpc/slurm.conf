# Single-node simulated cluster. Memory is enforced by polling (OverMemoryKill) because
# cgroup plugins are unreliable inside Docker Desktop. Finished jobs stay queryable via
# `scontrol show job` for MinJobAge seconds; jobcomp/filetxt keeps a completion record after that.
ClusterName=stellaris-local
SlurmctldHost=stellaris-slurm
SlurmUser=slurm
AuthType=auth/munge
StateSaveLocation=/state/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=2
JobAcctGatherParams=OverMemoryKill
JobCompType=jobcomp/filetxt
JobCompLoc=/state/jobcomp.log
SchedulerType=sched/backfill
PriorityType=priority/basic
# Without slurmdbd the main scheduler reports InvalidAccount; backfill still starts jobs, so run it every second.
SchedulerParameters=bf_interval=1
SelectType=select/cons_tres
SelectTypeParameters=CR_CPU_Memory
MinJobAge=86400
ReturnToService=2
NodeName=stellaris-slurm CPUs=2 RealMemory=2048 State=UNKNOWN
PartitionName=debug Nodes=stellaris-slurm Default=YES MaxTime=60 DefMemPerCPU=512 State=UP
