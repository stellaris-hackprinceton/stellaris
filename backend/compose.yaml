# Single local application Compose configuration.
# Per-project containers are NOT listed here; the api service creates them dynamically.
#
#   docker compose --profile build-only build   # builds application and terminal images
#   docker compose up -d --wait                 # starts frontend and API
name: stellaris

services:
  frontend:
    # Production build: fast page loads for demos and normal use. For hot reload while editing
    # the frontend, add the override: -f backend/compose.yaml -f backend/compose.dev.yaml
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      target: runtime
      args:
        STELLARIS_API_ORIGIN: http://api:8000
    image: stellaris-frontend:latest
    ports:
      - "127.0.0.1:${STELLARIS_FRONTEND_PORT:-3000}:3000"
    environment:
      STELLARIS_API_ORIGIN: http://api:8000
      STELLARIS_DOCS_ROOT: /app/docs
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: stellaris-api:dev
    ports:
      # Localhost-only: authentication is deferred, so the API must not be reachable from the LAN.
      - "127.0.0.1:${STELLARIS_API_PORT:-8000}:8000"
    environment:
      STELLARIS_DB_PATH: /data/stellaris.sqlite3
      STELLARIS_PROJECT_IMAGE: stellaris-project-runtime:dev
      STELLARIS_PROJECT_NETWORK: stellaris-projects
      STELLARIS_PROJECT_MEMORY_MB: ${STELLARIS_PROJECT_MEMORY_MB:-512}
      STELLARIS_PROJECT_CPUS: ${STELLARIS_PROJECT_CPUS:-1.0}
      STELLARIS_WORKER_IMAGE: stellaris-worker:dev
      STELLARIS_WORKER_MEMORY_MB: ${STELLARIS_WORKER_MEMORY_MB:-1536}
      STELLARIS_WORKER_CPUS: ${STELLARIS_WORKER_CPUS:-1.0}
      STELLARIS_WORKER_WALL_TIME_S: ${STELLARIS_WORKER_WALL_TIME_S:-600}
      # HPC stays unavailable unless explicitly configured. The demo cluster is opt-in.
      STELLARIS_SLURM_HOST: ${STELLARIS_SLURM_HOST:-}
      STELLARIS_SLURM_AUTHORIZED_KEYS_DIR: /hpc-keys
      STELLARIS_ALLOWED_HOSTS: localhost,127.0.0.1,[::1],api
      STELLARIS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000,http://127.0.0.1:8000,http://localhost:${STELLARIS_FRONTEND_PORT:-3000},http://127.0.0.1:${STELLARIS_FRONTEND_PORT:-3000}
    env_file:
      # Optional user-populated provider credentials, never committed or inspected by agents.
      - path: .env
        required: false
    volumes:
      - api-data:/data
      # Trusted primary backend only. Never mounted into project or worker containers.
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      - hpc-keys:/hpc-keys
    networks: [default, hpc]
    restart: unless-stopped

  # LOCAL DEMO ONLY. Opt-in profile; not started by ordinary compose up.
  slurm:
    profiles: ["hpc"]
    build:
      context: .
      dockerfile: hpc/Dockerfile
    image: stellaris-slurm:dev
    hostname: stellaris-slurm
    privileged: true
    networks:
      hpc:
        aliases: [stellaris-slurm]
    volumes:
      - slurm-state:/state
      - hpc-keys:/etc/stellaris-keys:ro
    restart: unless-stopped

  terminal-runtime:
    profiles: ["build-only"]
    build:
      context: .
      dockerfile: terminal/Dockerfile
    image: stellaris-terminal:dev

  # Build-only service: produces the image the api uses for per-project containers.
  # It is never started by `docker compose up` because its profile is not enabled there.
  project-runtime:
    profiles: ["build-only"]
    build:
      context: .
      dockerfile: project_runtime/Dockerfile
    image: stellaris-project-runtime:dev

  # Build-only service: scientific worker image. The api creates one temporary container
  # from it per analysis run (no network, no socket, no project volume).
  worker:
    profiles: ["build-only"]
    build:
      context: .
      dockerfile: worker/Dockerfile
    image: stellaris-worker:dev

volumes:
  api-data:
    name: stellaris-api-data
  hpc-keys:
    name: stellaris-hpc-keys
  slurm-state:
    name: stellaris-slurm-state
  frontend-node-modules:
    name: stellaris-frontend-node-modules
  frontend-next:
    name: stellaris-frontend-next

networks:
  hpc:
    name: stellaris-hpc
    internal: true
