<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stellaris Launch Video</title>
<style>
@font-face { font-family: "Geist"; src: url("assets/geist-latin.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Geist Mono"; src: url("assets/geist-mono-latin.woff2") format("woff2"); font-weight: 100 900; }
:root {
  --bg: #0b0c11; --canvas: #171a20; --surface: #1e2129; --muted-surface: #272b35; --text: #e6e8ee; --muted: #a0a6b4;
  --accent: #a68eff; --accent-2: #bba8ff; --border: #2e323d; --success: #62cf9d; --warn: #f0a254; --pink: #f07ba9; --blue: #6ba8ef;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
body { font-family: "Geist", system-ui, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
#stage { position: absolute; inset: 0; overflow: hidden; background: var(--bg); }
.layer { position: absolute; inset: 0; opacity: 0; }
.glow { position: absolute; border-radius: 50%; filter: blur(90px); pointer-events: none; }
.mono { font-family: "Geist Mono", ui-monospace, monospace; }
.abs { position: absolute; }
.statement { position: absolute; left: 0; right: 0; text-align: center; font-weight: 650; letter-spacing: -0.025em; }
.chip { position: absolute; padding: 14px 24px; border-radius: 999px; background: rgba(30,33,41,.92); border: 1px solid #343949;
  font-size: 26px; color: #c9cdd8; white-space: nowrap; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
.mark { position: absolute; color: var(--accent); filter: drop-shadow(0 0 24px rgba(166,142,255,.45)); }

/* Feature header: big kinetic title that moves into the corner. */
.hdr { position: absolute; left: 0; top: 0; transform-origin: 0 0; white-space: nowrap; }
.hnum { font-family: "Geist Mono", monospace; font-size: 46px; font-weight: 600; letter-spacing: .18em; color: var(--accent); margin-bottom: 6px; }
.htitle { font-size: 136px; font-weight: 720; letter-spacing: -0.04em; line-height: 1.02; }
.htitle span { display: inline-block; }
.hclip { display: inline-block; overflow: hidden; vertical-align: bottom; padding-bottom: 6px; }
.htag { position: absolute; left: 112px; top: 146px; font-size: 30px; color: var(--muted); white-space: nowrap; }
.htag em { font-style: normal; color: var(--accent-2); }

/* App-like UI pieces (tokens from frontend/styles/tokens.css, dark theme). */
.panel { position: absolute; background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
  box-shadow: 0 30px 90px rgba(0,0,0,.5), 0 0 0 1px rgba(166,142,255,.04); overflow: hidden; }
.phead { height: 64px; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 26px; gap: 14px; background: #1a1d24; }
.phead b { font-size: 22px; font-weight: 620; }
.phead span { font-size: 17px; color: var(--muted); }
.card { position: absolute; background: var(--canvas); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 16px 40px rgba(0,0,0,.4); }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; font-size: 17px; font-weight: 560; white-space: nowrap; }
.pill.ok { color: var(--success); border: 1.5px solid rgba(98,207,157,.6); background: rgba(98,207,157,.08); }
.pill.acc { color: var(--accent-2); border: 1.5px solid rgba(166,142,255,.6); background: rgba(166,142,255,.1); }
.pill.mut { color: var(--muted); border: 1.5px solid #3a3f4c; background: #22252e; }
.pill.warn { color: var(--warn); border: 1.5px solid rgba(240,162,84,.6); background: rgba(240,162,84,.08); }
.label { font-size: 16px; color: var(--muted); letter-spacing: .02em; }
.btn { position: absolute; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 10px; background: #6f58c9; color: #fff; font-size: 20px; font-weight: 600; }
.bubble { position: absolute; border-radius: 14px; padding: 16px 20px; font-size: 20px; line-height: 1.45; }
.code { font-family: "Geist Mono", monospace; font-size: 17.5px; line-height: 27px; white-space: pre; color: #c9cdd8; }
.kw { color: #c4a7ff; } .str { color: #8fd6a8; } .num { color: #f0b47a; } .cm { color: #6d7384; } .fn { color: #7fb6f5; }
.stat .k { font-family: "Geist Mono", monospace; font-size: 19px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
.stat .v { font-size: 66px; font-weight: 700; letter-spacing: -0.03em; margin-top: 4px; }
.tag { display: inline-block; padding: 6px 13px; border-radius: 8px; font-size: 17px; font-family: "Geist Mono", monospace; background: rgba(166,142,255,.14); color: var(--accent-2); border: 1px solid rgba(166,142,255,.4); }
</style>
</head>

<script>
// ======================= helpers: every frame is a pure function of t =======================
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const out = (k) => 1 - Math.pow(1 - k, 3);
const back = (k) => { const c = 1.7; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const prog = (t, a, b) => clamp((t - a) / (b - a));
const env = (t, a, b, fi = 0.45, fo = 0.4) => Math.min(out(prog(t, a, a + fi)), 1 - ease(prog(t, b - fo, b)));
const stage = document.getElementById('stage');
const $ = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html;
  if (cls === 'mark') e.appendChild(document.getElementById('mark-svg').content.cloneNode(true));
  (parent || stage).appendChild(e); return e; };
const box = (el, x, y, w, h) => { Object.assign(el.style, { left: `${x}px`, top: `${y}px`, width: w != null ? `${w}px` : '', height: h != null ? `${h}px` : '' }); return el; };
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
// Spring-in: element flies from an offset and settles with a little overshoot.
function fly(el, lt, t0, dur, from = {}) {
  const k = prog(lt, t0, t0 + dur), b = back(k);
  const x = lerp(from.x || 0, 0, b), y = lerp(from.y || 0, 0, b), r = lerp(from.r || 0, 0, b), s = lerp(from.s == null ? 1 : from.s, 1, b);
  el.style.transform = `translate(${x}px, ${y}px) rotate(${r}deg) scale(${s})`;
  el.style.opacity = out(clamp(k * 2.2));
  return k;
}
const scenes = [];
const scene = (a, b, build) => { const el = $('div', 'layer'); const upd = build(el, a, b); scenes.push({ a, b, el, upd }); };

// Ambient background glows.
const g1 = $('div', 'glow'); Object.assign(g1.style, { width: '900px', height: '900px', background: 'rgba(110,80,230,.22)' });
const g2 = $('div', 'glow'); Object.assign(g2.style, { width: '760px', height: '760px', background: 'rgba(60,90,200,.16)' });
function ambient(t) {
  g1.style.transform = `translate(${-200 + 160 * Math.sin(t / 7)}px, ${-260 + 100 * Math.cos(t / 9)}px)`;
  g2.style.transform = `translate(${1300 + 140 * Math.cos(t / 8)}px, ${520 + 90 * Math.sin(t / 6)}px)`;
}

// Fake mouse cursor (drawn over the UI it "clicks").
function cursorEl(parent) {
  const c = $('div', 'abs', parent, '<svg width="34" height="42" viewBox="0 0 26 32"><path d="M2 2 L2 26 L8.5 20 L13 30 L17 28.2 L12.6 18.6 L21 18.6 Z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>');
  c.style.filter = 'drop-shadow(0 4px 8px rgba(0,0,0,.55))'; c.style.zIndex = 50;
  return (x, y, press, o) => { c.style.transform = `translate(${x}px, ${y}px) scale(${press ? 0.85 : 1})`; c.style.opacity = o; };
}
// Typewriter: reveal n characters of text.
const typed = (text, lt, t0, t1) => text.slice(0, Math.round(text.length * prog(lt, t0, t1)));

// ======================= feature scene scaffold =======================
// Big title (number + name) slams in at the center, then moves into the top-left corner; content builds underneath.
function feature(a, b, num, title, tag, build) {
  scene(a, b, (el) => {
    const hdr = $('div', 'hdr', el);
    $('div', 'hnum', hdr, num);
    const tt = $('div', 'htitle', hdr);
    const chars = [...title].map((ch) => { const clip = $('span', 'hclip', tt); const s = $('span', null, clip, ch === ' ' ? '&nbsp;' : esc(ch)); return s; });
    const tagEl = $('div', 'htag', el, tag);
    const content = $('div', 'abs', el); Object.assign(content.style, { inset: 0 });
    const upd = build(content);
    return (t) => {
      const lt = t - a, dur = b - a;
      el.style.opacity = 1 - ease(prog(lt, dur - 0.35, dur));
      // Title: letters rise in, then the block flies to the corner.
      chars.forEach((s, i) => { const k = out(prog(lt, 0.02 + i * 0.018, 0.34 + i * 0.018)); s.style.transform = `translateY(${(1 - k) * 105}%)`; });
      const w = hdr.offsetWidth, h = hdr.offsetHeight;
      const m = ease(prog(lt, 0.85, 1.45));
      const sc = lerp(1, 0.4, m) * (1 + 0.04 * Math.sin(Math.PI * prog(lt, 0, 0.85)));
      hdr.style.transform = `translate(${lerp(960 - w / 2, 112, m)}px, ${lerp(540 - h / 2, 52, m)}px) scale(${sc})`;
      tagEl.style.opacity = out(prog(lt, 1.3, 1.8)); tagEl.style.transform = `translateX(${(1 - out(prog(lt, 1.3, 1.8))) * -30}px)`;
      // Content exits by sliding left as the next feature arrives.
      const ex = ease(prog(lt, dur - 0.5, dur));
      content.style.transform = `translateX(${-80 * ex}px) scale(${1 - 0.03 * ex})`;
      upd(lt, dur);
    };
  });
}

// ======================= 1. HOOK (0–8.4) =======================
const TOOLS = ['arXiv tabs', 'PDF folders', 'Jupyter notebooks', 'Spreadsheets', 'Python scripts', 'Plotting code', 'Lab videos',
  'Citation manager', 'Chatbot answers', 'Draft reports', 'CSV exports', 'Lab notes'];
const chipPos = TOOLS.map((_, i) => {
  const ang = (i / TOOLS.length) * Math.PI * 2 + 0.35;
  const rx = 700 + (i % 3) * 40, ry = 330 + (i % 2) * 40;
  return { x: 960 + Math.cos(ang) * rx, y: 540 + Math.sin(ang) * ry, d: 0.2 + (i * 0.17) % 2.0 };
});
scene(0, 8.4, (el) => {
  const chips = TOOLS.map((n) => $('div', 'chip', el, n));
  const s1 = $('div', 'statement', el, 'Research today is scattered<br>across a dozen tools.');
  Object.assign(s1.style, { top: '420px', fontSize: '84px', lineHeight: '1.08' });
  const s2 = $('div', 'statement', el, 'Nothing connects.<br><span style="color:var(--accent-2)">Nothing is reproducible.</span>');
  Object.assign(s2.style, { top: '420px', fontSize: '84px', lineHeight: '1.08' });
  return (t) => {
    el.style.opacity = 1;
    s1.style.opacity = env(t, 0.3, 3.7, 0.5, 0.4); s1.style.transform = `translateY(${(1 - out(prog(t, 0.3, 0.9))) * 20}px)`;
    s2.style.opacity = env(t, 3.9, 7.0, 0.45, 0.45); s2.style.transform = `translateY(${(1 - out(prog(t, 3.9, 4.4))) * 20}px)`;
    const collapse = ease(prog(t, 7.0, 8.2));
    chips.forEach((c, i) => {
      const p = chipPos[i], appear = out(prog(t, p.d, p.d + 0.45));
      const drift = 18 * Math.sin(t * 0.9 + i), scatter = prog(t, 3.9, 7.0) * 40;
      const x = lerp(p.x + drift + Math.cos(i) * scatter, 960, collapse), y = lerp(p.y + 0.6 * drift + Math.sin(i * 1.7) * scatter, 540, collapse);
      c.style.opacity = appear * (1 - collapse) * (t > 3.9 ? lerp(1, 0.55, prog(t, 3.9, 5)) : 1);
      c.style.transform = `translate(-50%,-50%) translate(${x}px, ${y}px) scale(${lerp(0.85, 1, appear) * (1 - 0.7 * collapse)}) rotate(${(i % 2 ? 1 : -1) * 2 * prog(t, 3.9, 7)}deg)`;
      c.style.left = '0px'; c.style.top = '0px';
    });
  };
});

// ======================= 2. REVEAL (7.6–13.5) =======================
scene(7.6, 13.5, (el, a, b) => {
  const m = $('div', 'mark', el); Object.assign(m.style, { width: '190px', height: '190px', left: '865px', top: '250px' });
  const ring = $('div', 'glow', el); Object.assign(ring.style, { width: '420px', height: '420px', left: '750px', top: '135px', background: 'rgba(166,142,255,.35)' });
  const name = $('div', 'statement', el, 'Stellaris'); Object.assign(name.style, { top: '470px', fontSize: '120px' });
  const tag = $('div', 'statement', el, 'From question to discovery.'); Object.assign(tag.style, { top: '625px', fontSize: '46px', fontWeight: 500, color: 'var(--accent-2)' });
  const sub = $('div', 'statement', el, 'An AI research workspace that finds the papers, runs the experiment,<br>and writes the report, with every step traceable.');
  Object.assign(sub.style, { top: '730px', fontSize: '32px', fontWeight: 450, color: 'var(--muted)', lineHeight: '1.4' });
  return (t) => {
    el.style.opacity = 1 - ease(prog(t, b - 0.4, b));
    const mi = out(prog(t, 7.9, 8.8));
    m.style.opacity = mi; m.style.transform = `scale(${lerp(0.4, 1, mi)}) rotate(${lerp(-60, 0, mi) + (t - 8) * 3}deg)`;
    ring.style.opacity = mi * (0.6 + 0.25 * Math.sin(t * 2));
    name.style.opacity = out(prog(t, 8.5, 9.1)); name.style.transform = `translateY(${(1 - out(prog(t, 8.5, 9.2))) * 24}px)`;
    tag.style.opacity = out(prog(t, 9.3, 9.9));
    sub.style.opacity = out(prog(t, 10.3, 10.9));
  };
});

// ======================= F1 · DEEP RESEARCH (13.5–25) =======================
const P0 = "Find relevant public arXiv literature for this project's research question and explain what the retrieved abstracts support.";
const R0 = [
  ['p', "I'll search arXiv for work on height–weight scaling, anthropometric regression, and generalized body-mass equations."],
  ['b', 'Yes—both relevant full papers were successfully retrieved and saved:'],
  ['li', '1. Multimodal AI for Body Fat Estimation — arXiv:2511.17576v1'],
  ['li', '2. Explaining human body responses in random vibration — arXiv:2306.12115v1'],
];
const PAPERS = [
  ['Multimodal AI for Body Fat Estimation: Computer Vision and Anthropometry with DEXA Benchmarks', 'Rayan Aldajani · 2025', 'arXiv:2511.17576v1'],
  ['Explaining human body responses in random vibration: Effect of motion direction, sitting posture, and anthropometry', 'M. M. Cvetković, R. Desai et al. · 2023', 'arXiv:2306.12115v1'],
];
feature(13.5, 25.0, '01', 'Deep research', 'Ask a question. The agent <em>searches arXiv and reads the full papers</em>.', (el) => {
  const P = box($('div', 'panel', el), 1010, 210, 800, 790);

  const conv = box($('div', 'abs', P), 26, 84, 748, 560);

  const reply = box($('div', 'abs', conv), 0, 190, 748); reply.style.fontSize = '19.5px'; reply.style.lineHeight = '1.5';
  const rHead = $('div', null, reply, '<b>Stellaris</b>'); rHead.style.cssText = 'font-size:16px;color:var(--muted);margin-bottom:8px';
  const rEls = R0.map(([kind]) => { const d = $('div', null, reply); d.style.marginBottom = kind === 'li' ? '6px' : '12px'; if (kind === 'b') d.style.fontWeight = 650; if (kind === 'li') d.style.paddingLeft = '14px'; return d; });

// ======================= frame renderer =======================
const DURATION = 117;
window.DURATION = DURATION;
window.renderFrame = (t) => {
  ambient(t);
  for (const s of scenes) {
    const on = t >= s.a - 0.01 && t <= s.b + 0.01;
    s.el.style.visibility = on ? 'visible' : 'hidden';
    if (!on) { s.el.style.opacity = 0; continue; }
    s.el.style.opacity = 1;
    s.upd(t);
  }
};
window.checkOverflow = () => [];
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map((i) => i.decode().catch(() => {}))]);
window.warmup = async () => {
  for (const sc of scenes) { window.renderFrame((sc.a + sc.b) / 2); await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r))); }
  await Promise.all([...document.images].map((i) => i.decode().catch(() => {})));
  window.renderFrame(0);
};
window.renderFrame(0);
